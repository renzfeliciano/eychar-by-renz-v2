<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#155dfc" />
    <title>Offline · EychAr</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8f4;
        --card: #fffefd;
        --fg: #171e2b;
        --muted: #5b616b;
        --border: #e2dfd9;
        --primary: #173567;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1118;
          --card: #121720;
          --fg: #efede8;
          --muted: #9fa5ae;
          --border: #262b33;
          --primary: #9dc1ee;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 32px -12px rgb(0 0 0 / 0.18);
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 20px;
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      small {
        display: block;
        margin-top: 18px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        EychAr needs a connection to load your records. Check your Wi-Fi or
        mobile data, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>EychAr /eɪtʃ ɑːr/ · people, time and payroll</small>
    </main>
  </body>
</html>
